name: Labrightbot Job Scanner

on:
  schedule:
    - cron: "7,37 * * * *"

  workflow_dispatch:

jobs:
  scan-jobs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Labrightbot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py

      - name: Save duplicate database
        run: |

          git config user.name "Labrightbot"
          git config user.email "labrightbot@users.noreply.github.com"

          git add posted_jobs.json

          git diff --cached --quiet || git commit -m "Update posted jobs database"

          git push
